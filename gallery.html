<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — RepPic</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .gallery-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      animation: fadeUp 0.5s ease 0.15s both;
    }

    .view-toggle { display: flex; gap: 4px; }

    .view-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted2);
      width: 34px; height: 34px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .view-btn.active,
    .view-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .photo-count {
      font-size: 0.8rem;
      color: var(--muted2);
      margin-left: auto;
    }

    /* ── LIGHTBOX INFO ── */
    #lightbox-info {
      position: fixed;
      bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(18,18,18,0.95);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 20px;
      font-size: 0.82rem;
      color: var(--muted2);
      z-index: 1001;
      display: none;
      text-align: center;
      backdrop-filter: blur(10px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
      white-space: nowrap;
    }
    #lightbox-info.show {
      display: block;
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── LIGHTBOX ARROWS ── */
    .lb-arrow {
      position: fixed;
      top: 50%; 
      transform: translateY(-50%);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      width: 44px; height: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1001;
      transition: all 0.2s;
      backdrop-filter: blur(4px);
    }
    .lb-arrow:hover { background: rgba(255,255,255,0.12); transform: translateY(-50%) scale(1.1); }
    .lb-arrow.visible { display: flex; }
    #lb-prev { left: 20px; }
    #lb-next { right: 20px; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">RepPic</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="upload.html">Upload</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="compare.html">Compare</a></li>
    </ul>
  </nav>

  <div class="page">
    <div class="page-header">
      <div class="eyebrow">All entries</div>
      <h2>GALLERY</h2>
      <p>Your full photo history. Click any image to view full size.</p>
    </div>

    <div class="gallery-toolbar">
      <div class="filter-bar" id="filter-bar">
        <button class="filter-btn active" data-tag="all">All</button>
        <button class="filter-btn" data-tag="Front">Front</button>
        <button class="filter-btn" data-tag="Back">Back</button>
        <button class="filter-btn" data-tag="Side">Side</button>
        <button class="filter-btn" data-tag="Flexing">Flexing</button>
        <button class="filter-btn" data-tag="Casual">Casual</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="view-toggle">
          <button class="view-btn active" id="view-grid" title="Grid">⊞</button>
          <button class="view-btn" id="view-timeline" title="Timeline">☰</button>
        </div>
        <span class="photo-count" id="photo-count"></span>
      </div>
    </div>

    <div id="gallery-container"></div>
  </div>

  <!-- Lightbox arrows -->
  <button class="lb-arrow" id="lb-prev">‹</button>
  <button class="lb-arrow" id="lb-next">›</button>

  <script src="app.js"></script>
  <script>
    let currentFilter = 'all';
    let currentView   = 'grid';
    let lightboxPhotos = [];
    let lightboxIndex  = 0;

    function getFiltered() {
      const photos = getPhotos();
      return currentFilter === 'all' ? photos : photos.filter(p => p.tag === currentFilter);
    }

    function renderGrid(photos) {
      if (photos.length === 0) return emptyHTML();
      return `<div class="photo-grid">${
        photos.map(p => `
          <div class="photo-card">
            <div class="photo-overlay"></div>
            <img src="${p.src}" alt="${p.label}" onclick="openLightbox('${p.id}')" />
            <button class="delete-btn" onclick="handleDelete('${p.id}')">✕</button>
            <div class="photo-info">
              <div class="photo-date">${formatDate(p.createdAt)}</div>
              <div class="photo-label">${p.label || 'Untitled'}</div>
              ${p.tag ? `<span class="photo-tag">${p.tag}</span>` : ''}
            </div>
          </div>`).join('')
      }</div>`;
    }

    function renderTimeline(photos) {
      if (photos.length === 0) return emptyHTML();
      const groups = groupByMonth(photos);
      return `<div class="timeline">${
        Object.entries(groups).map(([month, items]) => `
          <div class="timeline-month">
            <div class="timeline-month-header">
              <span>${month}</span>
              <span style="font-size:0.75rem;font-family:'DM Sans',sans-serif;font-weight:400;">${items.length} photo${items.length !== 1 ? 's' : ''}</span>
            </div>
            <div class="timeline-month-photos">
              ${items.map(p => `<img src="${p.src}" alt="${p.label}" title="${p.label}" onclick="openLightbox('${p.id}')" />`).join('')}
            </div>
          </div>`).join('')
      }</div>`;
    }

    function emptyHTML() {
      return `<div class="empty-state">
        <div class="empty-icon">📷</div>
        <p>${currentFilter === 'all' ? 'No photos yet.' : `No "${currentFilter}" photos found.`}</p>
        <a href="upload.html" class="btn btn-primary">+ Upload Photo</a>
      </div>`;
    }

    function render() {
      lightboxPhotos = getFiltered();
      const container = document.getElementById('gallery-container');
      document.getElementById('photo-count').textContent =
        `${lightboxPhotos.length} photo${lightboxPhotos.length !== 1 ? 's' : ''}`;
      // Fade out, swap, fade in
      container.style.transition = 'opacity 0.2s ease';
      container.style.opacity = '0';
      setTimeout(() => {
        container.innerHTML = currentView === 'grid'
          ? renderGrid(lightboxPhotos)
          : renderTimeline(lightboxPhotos);
        container.style.opacity = '1';
      }, 180);
    }

    // ── Lightbox ──
    function openLightbox(id) {
      lightboxPhotos = getFiltered();
      lightboxIndex  = lightboxPhotos.findIndex(p => p.id === id);
      showLightboxPhoto();
    }

    function showLightboxPhoto() {
      const photo = lightboxPhotos[lightboxIndex];
      if (!photo) return;
      openModal(photo.src);
      updateLightboxInfo(photo);
      updateArrows();
    }

    function updateLightboxInfo(photo) {
      let info = document.getElementById('lightbox-info');
      if (!info) {
        info = document.createElement('div');
        info.id = 'lightbox-info';
        document.body.appendChild(info);
      }
      const parts = [formatDate(photo.createdAt)];
      if (photo.label && photo.label !== 'Untitled') parts.push(photo.label);
      if (photo.weight) parts.push(`⚖️ ${photo.weight}`);
      if (photo.tag)    parts.push(photo.tag);
      info.textContent = parts.join(' · ');
      info.className = 'show';
      info.style.display = 'block';
      setTimeout(() => info.classList.add('show'), 10);
    }

    function updateArrows() {
      const prev = document.getElementById('lb-prev');
      const next = document.getElementById('lb-next');
      prev.classList.toggle('visible', lightboxIndex > 0);
      next.classList.toggle('visible', lightboxIndex < lightboxPhotos.length - 1);
    }

    document.getElementById('lb-prev').addEventListener('click', () => {
      if (lightboxIndex > 0) { lightboxIndex--; showLightboxPhoto(); }
    });
    document.getElementById('lb-next').addEventListener('click', () => {
      if (lightboxIndex < lightboxPhotos.length - 1) { lightboxIndex++; showLightboxPhoto(); }
    });

    document.addEventListener('keydown', e => {
      const overlay = document.getElementById('modal-overlay');
      if (!overlay?.classList.contains('open')) return;
      if (e.key === 'ArrowRight' && lightboxIndex < lightboxPhotos.length - 1) { lightboxIndex++; showLightboxPhoto(); }
      if (e.key === 'ArrowLeft'  && lightboxIndex > 0)                          { lightboxIndex--; showLightboxPhoto(); }
    });

    function handleDelete(id) {
      if (confirm('Delete this photo? This cannot be undone.')) {
        deletePhoto(id);
        showToast('Photo deleted.');
        render();
      }
    }

    // ── Filters ──
    document.getElementById('filter-bar').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.tag;
      render();
    });

    // ── View toggle ──
    document.getElementById('view-grid').addEventListener('click', () => {
      currentView = 'grid';
      document.getElementById('view-grid').classList.add('active');
      document.getElementById('view-timeline').classList.remove('active');
      render();
    });
    document.getElementById('view-timeline').addEventListener('click', () => {
      currentView = 'timeline';
      document.getElementById('view-timeline').classList.add('active');
      document.getElementById('view-grid').classList.remove('active');
      render();
    });

    render();
  </script>
</body>
</html>
