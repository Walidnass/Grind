<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="true" />
  <meta name="apple-mobile-web-app-capable" content="true" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Grind Log" />
  <title>Grind Log</title>

  <!-- Inline manifest via JS blob -->
  <script>
    const manifest = {
      name: "Grind Log",
      short_name: "GrindLog",
      description: "Track your workout journey with photos",
      start_url: "./",
      display: "standalone",
      background_color: "#0a0a0a",
      theme_color: "#0a0a0a",
      orientation: "portrait",
      icons: [
        { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%230a0a0a'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-size='300' fill='%23e8ff47'%3E💪%3C/text%3E%3C/svg%3E", sizes: "512x512", type: "image/svg+xml" }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
    const manifestURL = URL.createObjectURL(blob);
    document.write(`<link rel="manifest" href="${manifestURL}">`);
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --yellow: #e8ff47;
      --bg: #0a0a0a;
      --surface: #111;
      --border: #1e1e1e;
      --muted: #444;
      --text: #f0f0f0;
      --red: #ff4747;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; overflow: hidden; }
    ::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-thumb { background: var(--yellow); }

    /* LAYOUT */
    #app { display: flex; flex-direction: column; height: 100%; padding-top: var(--safe-top); }
    #header { flex-shrink: 0; padding: 16px 20px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    #content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    #nav { flex-shrink: 0; display: flex; border-top: 1px solid var(--border); padding-bottom: var(--safe-bottom); background: var(--surface); }

    /* HEADER */
    .app-title { font-family: 'Black Ops One', cursive; font-size: 22px; color: var(--yellow); letter-spacing: 0.05em; }
    .app-subtitle { font-size: 9px; color: var(--muted); letter-spacing: 0.25em; margin-top: 2px; }

    /* NAV */
    .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 4px; gap: 4px; font-size: 9px; letter-spacing: 0.15em; color: var(--muted); background: none; border: none; cursor: pointer; transition: color 0.15s; text-transform: uppercase; font-family: 'Space Mono', monospace; }
    .nav-btn.active { color: var(--yellow); }
    .nav-btn svg { width: 22px; height: 22px; }

    /* BUTTONS */
    .btn { font-family: 'Space Mono', monospace; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; border: none; cursor: pointer; transition: all 0.15s; font-size: 12px; padding: 12px 20px; }
    .btn-primary { background: var(--yellow); color: var(--bg); }
    .btn-ghost { background: transparent; color: var(--yellow); border: 1px solid var(--yellow); }
    .btn-ghost:active { background: var(--yellow); color: var(--bg); }
    .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
    .btn-danger:active { background: var(--red); color: #fff; }
    .btn-sm { padding: 8px 14px; font-size: 11px; }
    .btn-full { width: 100%; }

    /* GRID */
    .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; padding: 2px; }
    .grid-item { position: relative; aspect-ratio: 1; overflow: hidden; background: #0d0d0d; cursor: pointer; }
    .grid-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.2s; }
    .grid-item:active img { transform: scale(0.97); }
    .grid-badge { position: absolute; bottom: 6px; left: 6px; right: 6px; }
    .grid-date { font-size: 9px; color: rgba(255,255,255,0.6); }
    .grid-weight { font-family: 'Black Ops One', cursive; font-size: 16px; color: var(--yellow); }
    .tag { display: inline-block; padding: 2px 8px; font-size: 9px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; }

    /* EMPTY */
    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; padding: 40px; text-align: center; }
    .empty-icon { font-size: 56px; }
    .empty-title { font-family: 'Black Ops One', cursive; font-size: 20px; color: #222; letter-spacing: 0.1em; }
    .empty-sub { font-size: 11px; color: var(--muted); line-height: 1.7; }

    /* FORM */
    .form-screen { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .form-label { font-size: 9px; letter-spacing: 0.2em; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
    .form-input { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: 'Space Mono', monospace; font-size: 14px; padding: 12px 14px; width: 100%; outline: none; }
    .form-input:focus { border-color: var(--yellow); }
    select.form-input option { background: #111; }
    .preview-wrap { position: relative; border: 1px solid var(--border); }
    .preview-wrap img { width: 100%; max-height: 280px; object-fit: cover; display: block; }
    .preview-change { position: absolute; bottom: 10px; right: 10px; }

    /* MODAL */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; display: flex; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .modal-img { width: 100%; max-height: 60vh; object-fit: cover; display: block; }
    .modal-body { padding: 20px; flex: 1; }
    .modal-meta { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .modal-date { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .modal-weight { font-family: 'Black Ops One', cursive; font-size: 28px; color: var(--yellow); }
    .modal-note { font-size: 13px; color: #aaa; line-height: 1.7; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; }
    .modal-close { position: absolute; top: calc(var(--safe-top) + 12px); right: 16px; background: rgba(0,0,0,0.6); border: 1px solid #333; color: #fff; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; z-index: 210; }

    /* COMPARE */
    .compare-screen { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .compare-slots { display: flex; gap: 8px; }
    .compare-slot { flex: 1; aspect-ratio: 0.75; border: 2px dashed #2a2a2a; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; transition: border-color 0.2s; }
    .compare-slot.active-pick { border-color: var(--yellow); border-style: solid; }
    .compare-slot img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
    .compare-slot-info { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.85)); padding: 20px 10px 10px; }
    .compare-slot-label { position: absolute; top: 8px; left: 8px; font-family: 'Black Ops One', cursive; font-size: 20px; color: var(--yellow); text-shadow: 0 0 10px rgba(0,0,0,0.8); z-index: 2; }
    .thumb-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .thumb { width: 70px; height: 70px; flex-shrink: 0; overflow: hidden; border: 2px solid transparent; cursor: pointer; transition: border-color 0.15s; }
    .thumb.selected { border-color: var(--yellow); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .section-label { font-size: 9px; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; }

    /* STATS */
    .stats-screen { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); padding: 16px; }
    .stat-val { font-family: 'Black Ops One', cursive; font-size: 32px; color: var(--yellow); }
    .stat-label { font-size: 9px; letter-spacing: 0.2em; color: var(--muted); margin-top: 4px; text-transform: uppercase; }
    .weight-chart { display: flex; align-items: flex-end; gap: 4px; height: 80px; margin-top: 12px; }
    .weight-bar { flex: 1; background: var(--yellow); opacity: 0.7; min-width: 8px; transition: opacity 0.2s; }
    .weight-bar:hover { opacity: 1; }

    /* INSTALL BANNER */
    #install-banner { display: none; background: var(--yellow); color: var(--bg); padding: 12px 20px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; text-align: center; flex-shrink: 0; }
    #install-banner.show { display: block; }

    /* ANIMATIONS */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp 0.25s ease forwards; }

    /* TAG COLORS */
    .tag-front { background: var(--yellow); color: var(--bg); }
    .tag-back { background: #ff6b35; color: #fff; }
    .tag-side { background: #38d9f5; color: var(--bg); }
    .tag-full { background: #c47eff; color: #fff; }
  </style>
</head>
<body>

<div id="app">
  <div id="install-banner" onclick="installPWA()">📲 Add to Home Screen</div>

  <div id="header">
    <div>
      <div class="app-title">GRIND LOG</div>
      <div class="app-subtitle" id="header-sub">0 CHECK-INS</div>
    </div>
    <button class="btn btn-primary btn-sm" onclick="triggerUpload()">+ ADD</button>
  </div>

  <div id="content"></div>

  <nav id="nav">
    <button class="nav-btn active" id="nav-gallery" onclick="showScreen('gallery')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Gallery
    </button>
    <button class="nav-btn" id="nav-compare" onclick="showScreen('compare')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2v-4M9 21H5a2 2 0 01-2-2v-4m0 0h18"/></svg>
      Compare
    </button>
    <button class="nav-btn" id="nav-stats" onclick="showScreen('stats')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Progress
    </button>
  </nav>
</div>

<input type="file" id="file-input" accept="image/*" capture="environment" style="display:none" onchange="handleFile(event)" />

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const DB_KEY = 'grindlog-v1';
let entries = [];
let currentScreen = 'gallery';
let pendingImg = null;
let deferredPrompt = null;
let compareA = null, compareB = null, comparePicking = 'A';

function save() { localStorage.setItem(DB_KEY, JSON.stringify(entries)); }
function load() {
  try { entries = JSON.parse(localStorage.getItem(DB_KEY) || '[]'); } catch { entries = []; }
}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(ts) {
  const d = new Date(ts);
  return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}
function fmtDateShort(ts) {
  const d = new Date(ts);
  return `${MONTHS[d.getMonth()]} ${d.getDate()}`;
}

// ── PWA INSTALL ───────────────────────────────────────────────────────────────
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-banner').classList.add('show');
});
window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner').classList.remove('show');
});
function installPWA() {
  if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then(() => { deferredPrompt = null; document.getElementById('install-banner').classList.remove('show'); }); }
}

// ── SERVICE WORKER ─────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'grindlog-sw-v1';
    self.addEventListener('install', e => { self.skipWaiting(); });
    self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });
    self.addEventListener('fetch', e => {
      if (e.request.method !== 'GET') return;
      e.respondWith(caches.open(CACHE).then(cache => cache.match(e.request).then(r => r || fetch(e.request).then(res => { cache.put(e.request, res.clone()); return res; }))));
    });
  `;
  const swBlob = new Blob([swCode], { type: 'application/javascript' });
  const swURL = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swURL).catch(() => {});
}

// ── FILE HANDLING ─────────────────────────────────────────────────────────────
function triggerUpload() { document.getElementById('file-input').click(); }

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = r => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1000;
      let w = img.width, h = img.height;
      if (w > h && w > MAX) { h = h * MAX / w; w = MAX; }
      else if (h > MAX) { w = w * MAX / h; h = MAX; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      pendingImg = canvas.toDataURL('image/jpeg', 0.75);
      showScreen('add');
    };
    img.src = r.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

// ── SCREENS ───────────────────────────────────────────────────────────────────
function showScreen(screen) {
  currentScreen = screen;
  ['gallery','compare','stats'].forEach(s => {
    const btn = document.getElementById('nav-' + s);
    if (btn) btn.classList.toggle('active', s === screen);
  });
  const content = document.getElementById('content');
  content.innerHTML = '';

  if (screen === 'gallery') renderGallery(content);
  else if (screen === 'add') renderAdd(content);
  else if (screen === 'compare') renderCompare(content);
  else if (screen === 'stats') renderStats(content);

  updateHeader();
}

function updateHeader() {
  document.getElementById('header-sub').textContent =
    `${entries.length} CHECK-IN${entries.length !== 1 ? 'S' : ''}`;
}

// ── GALLERY ───────────────────────────────────────────────────────────────────
function renderGallery(el) {
  if (entries.length === 0) {
    el.innerHTML = `
      <div class="empty fade-up">
        <div class="empty-icon">📸</div>
        <div class="empty-title">NO ENTRIES YET</div>
        <div class="empty-sub">Tap + ADD to log your first<br>check-in photo and start tracking.</div>
        <button class="btn btn-primary" onclick="triggerUpload()">Add First Photo</button>
      </div>`;
    return;
  }
  const grid = document.createElement('div');
  grid.className = 'photo-grid fade-up';
  entries.forEach(e => {
    const item = document.createElement('div');
    item.className = 'grid-item';
    item.innerHTML = `
      <img src="${e.img}" loading="lazy" />
      <div class="grid-badge">
        <div class="grid-date">${fmtDateShort(e.ts)}</div>
        ${e.weight ? `<div class="grid-weight">${e.weight}<span style="font-size:11px;font-family:'Space Mono',monospace"> lbs</span></div>` : ''}
      </div>
      <span class="tag tag-${e.tag}" style="position:absolute;top:6px;left:6px">${e.tag}</span>`;
    item.onclick = () => openDetail(e);
    grid.appendChild(item);
  });
  el.appendChild(grid);
}

// ── DETAIL MODAL ──────────────────────────────────────────────────────────────
function openDetail(entry) {
  const overlay = document.createElement('div');
  overlay.className = 'overlay fade-up';
  overlay.innerHTML = `
    <div class="modal-close" onclick="this.closest('.overlay').remove()">✕</div>
    <img class="modal-img" src="${entry.img}" />
    <div class="modal-body">
      <div class="modal-meta">
        <div>
          <div class="modal-date">${fmtDate(entry.ts)}</div>
          <span class="tag tag-${entry.tag}">${entry.tag}</span>
        </div>
        ${entry.weight ? `<div class="modal-weight">${entry.weight}<span style="font-size:14px;font-family:'Space Mono',monospace"> lbs</span></div>` : ''}
      </div>
      ${entry.note ? `<div class="modal-note">${entry.note}</div>` : ''}
      <div class="modal-actions">
        <button class="btn btn-danger btn-sm" onclick="deleteEntry(${entry.id})">Delete</button>
        <button class="btn btn-ghost btn-sm" onclick="this.closest('.overlay').remove()">Close</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function deleteEntry(id) {
  if (!confirm('Delete this check-in?')) return;
  entries = entries.filter(e => e.id !== id);
  save();
  document.querySelector('.overlay')?.remove();
  showScreen('gallery');
}

// ── ADD ───────────────────────────────────────────────────────────────────────
function renderAdd(el) {
  el.innerHTML = `
    <div class="form-screen fade-up">
      <div class="preview-wrap">
        <img src="${pendingImg}" id="preview-img" />
        <button class="btn btn-ghost btn-sm preview-change" onclick="triggerUpload()">Change</button>
      </div>
      <div>
        <div class="form-label">Angle</div>
        <select class="form-input" id="f-tag">
          <option value="front">Front</option>
          <option value="back">Back</option>
          <option value="side">Side</option>
          <option value="full">Full Body</option>
        </select>
      </div>
      <div>
        <div class="form-label">Weight (lbs)</div>
        <input class="form-input" id="f-weight" type="number" placeholder="Optional" />
      </div>
      <div>
        <div class="form-label">Note</div>
        <textarea class="form-input" id="f-note" rows="3" placeholder="How you feeling? New PR? Mood?"></textarea>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-primary" style="flex:1" onclick="saveEntry()">Save</button>
        <button class="btn btn-ghost" onclick="showScreen('gallery');pendingImg=null">Cancel</button>
      </div>
    </div>`;
}

function saveEntry() {
  if (!pendingImg) { alert('No image found. Try selecting the photo again.'); return; }
  const entry = {
    id: Date.now(), ts: Date.now(), img: pendingImg,
    tag: document.getElementById('f-tag').value,
    weight: document.getElementById('f-weight').value,
    note: document.getElementById('f-note').value,
  };
  entries.unshift(entry);
  try { localStorage.setItem(DB_KEY, JSON.stringify(entries)); }
  catch(err) { entries.shift(); alert('Storage full! Delete some old entries first.'); return; }
  pendingImg = null;
  showScreen('gallery');
}

// ── COMPARE ───────────────────────────────────────────────────────────────────
function renderCompare(el) {
  if (entries.length < 2) {
    el.innerHTML = `<div class="empty fade-up"><div class="empty-icon">⚖️</div><div class="empty-title">NEED 2 PHOTOS</div><div class="empty-sub">Add at least 2 check-ins<br>to use the compare feature.</div></div>`;
    return;
  }
  if (!compareA) compareA = entries[entries.length - 1];
  if (!compareB) compareB = entries[0];

  const screen = document.createElement('div');
  screen.className = 'compare-screen fade-up';

  screen.innerHTML = `
    <div class="section-label">Tap a slot, then pick a photo below</div>
    <div class="compare-slots">
      ${['A','B'].map(k => {
        const e = k === 'A' ? compareA : compareB;
        return `<div class="compare-slot ${comparePicking === k ? 'active-pick' : ''}" id="slot-${k}" onclick="comparePicking='${k}';renderCompare(document.getElementById('content'))">
          <span class="compare-slot-label">${k}</span>
          ${e ? `<img src="${e.img}" /><div class="compare-slot-info"><div style="font-size:9px;color:#aaa">${fmtDateShort(e.ts)}</div>${e.weight?`<div style="font-family:'Black Ops One',cursive;font-size:16px;color:#e8ff47">${e.weight} lbs</div>`:''}</div>` : '<div style="color:#333;font-size:28px">+</div>'}
        </div>`;
      }).join('')}
    </div>
    ${compareA && compareB && compareA.weight && compareB.weight ? `
      <div class="stat-card">
        <div class="section-label" style="margin-bottom:8px">Weight Difference</div>
        <div style="font-family:'Black Ops One',cursive;font-size:28px;color:${parseFloat(compareB.weight) - parseFloat(compareA.weight) <= 0 ? '#e8ff47' : '#ff6b35'}">
          ${parseFloat(compareB.weight) - parseFloat(compareA.weight) > 0 ? '+' : ''}${(parseFloat(compareB.weight) - parseFloat(compareA.weight)).toFixed(1)} lbs
        </div>
        <div style="font-size:10px;color:#555;margin-top:4px">${fmtDateShort(compareA.ts)} → ${fmtDateShort(compareB.ts)}</div>
      </div>` : ''}
    <div class="section-label">Pick for Slot ${comparePicking}</div>
    <div class="thumb-row" id="thumb-row"></div>`;

  el.innerHTML = '';
  el.appendChild(screen);

  const thumbRow = screen.querySelector('#thumb-row');
  entries.forEach(e => {
    const t = document.createElement('div');
    t.className = `thumb ${(compareA?.id === e.id || compareB?.id === e.id) ? 'selected' : ''}`;
    t.innerHTML = `<img src="${e.img}" loading="lazy" />`;
    t.onclick = () => {
      if (comparePicking === 'A') { compareA = e; comparePicking = 'B'; }
      else { compareB = e; comparePicking = 'A'; }
      renderCompare(document.getElementById('content'));
    };
    thumbRow.appendChild(t);
  });
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function renderStats(el) {
  if (entries.length === 0) {
    el.innerHTML = `<div class="empty fade-up"><div class="empty-icon">📈</div><div class="empty-title">NO DATA YET</div><div class="empty-sub">Add check-ins to see your progress stats.</div></div>`;
    return;
  }

  const withWeight = entries.filter(e => e.weight).sort((a,b) => a.ts - b.ts);
  const daySpan = entries.length > 1 ? Math.round((entries[0].ts - entries[entries.length-1].ts) / 86400000) + 1 : 1;
  const streak = calcStreak();

  const screen = document.createElement('div');
  screen.className = 'stats-screen fade-up';
  screen.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="stat-card"><div class="stat-val">${entries.length}</div><div class="stat-label">Check-ins</div></div>
      <div class="stat-card"><div class="stat-val">${daySpan}</div><div class="stat-label">Days Tracked</div></div>
      <div class="stat-card"><div class="stat-val">${streak}</div><div class="stat-label">Day Streak</div></div>
      <div class="stat-card"><div class="stat-val">${withWeight.length}</div><div class="stat-label">Weigh-ins</div></div>
    </div>
    ${withWeight.length >= 2 ? `
    <div class="stat-card">
      <div class="section-label" style="margin-bottom:4px">Weight Journey</div>
      <div style="font-size:11px;color:#555;margin-bottom:10px">${fmtDateShort(withWeight[0].ts)} → ${fmtDateShort(withWeight[withWeight.length-1].ts)}</div>
      <div class="weight-chart" id="wchart"></div>
      <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:#555">
        <span>${withWeight[0].weight} lbs</span>
        <span>${withWeight[withWeight.length-1].weight} lbs</span>
      </div>
      <div style="margin-top:12px;font-family:'Black Ops One',cursive;font-size:22px;color:${parseFloat(withWeight[withWeight.length-1].weight) - parseFloat(withWeight[0].weight) <= 0 ? '#e8ff47':'#ff6b35'}">
        ${parseFloat(withWeight[withWeight.length-1].weight) - parseFloat(withWeight[0].weight) > 0 ? '+' : ''}${(parseFloat(withWeight[withWeight.length-1].weight) - parseFloat(withWeight[0].weight)).toFixed(1)} lbs total
      </div>
    </div>` : ''}
    <div class="stat-card">
      <div class="section-label" style="margin-bottom:10px">Timeline</div>
      ${[...entries].reverse().map(e => `
        <div style="display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #1a1a1a">
          <img src="${e.img}" style="width:44px;height:44px;object-fit:cover;flex-shrink:0" />
          <div style="flex:1;min-width:0">
            <div style="font-size:10px;color:#555">${fmtDate(e.ts)}</div>
            <div style="display:flex;align-items:center;gap:8px;margin-top:2px">
              <span class="tag tag-${e.tag}">${e.tag}</span>
              ${e.weight ? `<span style="font-size:12px;color:#e8ff47;font-weight:700">${e.weight} lbs</span>` : ''}
            </div>
            ${e.note ? `<div style="font-size:11px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px">${e.note}</div>` : ''}
          </div>
        </div>`).join('')}
    </div>`;

  el.innerHTML = '';
  el.appendChild(screen);

  // Draw weight chart bars
  if (withWeight.length >= 2) {
    const chart = screen.querySelector('#wchart');
    const weights = withWeight.map(e => parseFloat(e.weight));
    const min = Math.min(...weights);
    const max = Math.max(...weights);
    const range = max - min || 1;
    weights.forEach(w => {
      const bar = document.createElement('div');
      bar.className = 'weight-bar';
      bar.style.height = `${20 + ((w - min) / range) * 60}px`;
      bar.title = w + ' lbs';
      chart.appendChild(bar);
    });
  }
}

function calcStreak() {
  if (!entries.length) return 0;
  const days = new Set(entries.map(e => {
    const d = new Date(e.ts);
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }));
  let streak = 0, d = new Date();
  while (true) {
    const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    if (!days.has(key)) break;
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
load();
showScreen('gallery');
</script>
</body>
</html>
