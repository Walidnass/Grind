<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compare — RepPic</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .compare-wrapper {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .compare-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) {
      .compare-container { grid-template-columns: 1fr; }
    }

    .compare-slot {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 460px;
    }

    .slot-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .slot-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 2px;
    }

    .slot-label.before { color: #6ec6ff; }
    .slot-label.after  { color: var(--accent); }

    .slot-body {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .slot-body img {
      width: 100%;
      flex: 1;
      object-fit: cover;
      min-height: 300px;
      cursor: pointer;
    }

    .slot-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.85rem;
      gap: 12px;
      padding: 30px;
    }

    .slot-empty .empty-icon { font-size: 2rem; opacity: 0.3; }

    .slot-info {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted2);
      min-height: 56px;
    }

    .slot-info .info-label {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }

    /* Picker modal */
    .picker-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 200;
      display: none;
      padding: 40px;
      overflow-y: auto;
    }

    .picker-overlay.open { display: block; }

    .picker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .picker-header h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 2px;
    }

    .picker-close {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .picker-close:hover { opacity: 1; }

    .picker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }

    .picker-item {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
    }

    .picker-item:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .picker-item img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      display: block;
    }

    .picker-item .picker-item-info {
      padding: 8px 10px;
    }

    .picker-item .picker-item-date {
      font-size: 0.68rem;
      color: var(--muted2);
      text-transform: uppercase;
    }

    .picker-item .picker-item-label {
      font-size: 0.8rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Diff bar */
    .diff-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      display: none;
    }

    .diff-bar.visible { display: block; }

    .diff-bar h3 {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 2px;
      font-size: 1rem;
      color: var(--muted2);
      margin-bottom: 16px;
    }

    .diff-info {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      font-size: 0.85rem;
    }

    .diff-item strong {
      color: var(--accent);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .diff-label {
      color: var(--muted2);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">RepPic</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="upload.html">Upload</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="compare.html">Compare</a></li>
    </ul>
  </nav>

  <div class="page">
    <div class="page-header">
      <div class="eyebrow">Side by side</div>
      <h2>COMPARE</h2>
      <p>Pick two photos to see how far you've come. Use BEFORE and AFTER slots.</p>
    </div>

    <div class="compare-wrapper">
      <!-- Two slots -->
      <div class="compare-container">
        <!-- BEFORE -->
        <div class="compare-slot" id="slot-before">
          <div class="slot-header">
            <span class="slot-label before">Before</span>
            <button class="btn btn-ghost" style="padding:6px 12px;font-size:0.73rem;" onclick="openPicker('before')">Pick Photo</button>
          </div>
          <div class="slot-body" id="body-before">
            <div class="slot-empty">
              <div class="empty-icon">📷</div>
              <span>No photo selected</span>
              <button class="btn btn-ghost" onclick="openPicker('before')">Choose</button>
            </div>
          </div>
          <div class="slot-info" id="info-before"></div>
        </div>

        <!-- AFTER -->
        <div class="compare-slot" id="slot-after">
          <div class="slot-header">
            <span class="slot-label after">After</span>
            <button class="btn btn-ghost" style="padding:6px 12px;font-size:0.73rem;" onclick="openPicker('after')">Pick Photo</button>
          </div>
          <div class="slot-body" id="body-after">
            <div class="slot-empty">
              <div class="empty-icon">📷</div>
              <span>No photo selected</span>
              <button class="btn btn-ghost" onclick="openPicker('after')">Choose</button>
            </div>
          </div>
          <div class="slot-info" id="info-after"></div>
        </div>
      </div>

      <!-- Diff info -->
      <div class="diff-bar" id="diff-bar">
        <h3>Summary</h3>
        <div class="diff-info" id="diff-info"></div>
      </div>
    </div>
  </div>

  <!-- Picker overlay -->
  <div class="picker-overlay" id="picker-overlay">
    <div class="picker-header">
      <h3 id="picker-title">Select a Photo</h3>
      <button class="picker-close" onclick="closePicker()">✕</button>
    </div>
    <div class="picker-grid" id="picker-grid"></div>
  </div>

  <script src="app.js"></script>
  <script>
    let pickerTarget = null;
    let selections = { before: null, after: null };

    function openPicker(slot) {
      pickerTarget = slot;
      document.getElementById('picker-title').textContent =
        slot === 'before' ? 'Select BEFORE Photo' : 'Select AFTER Photo';

      const photos = getPhotos();
      const grid = document.getElementById('picker-grid');

      if (photos.length === 0) {
        grid.innerHTML = `<div style="color:var(--muted2);font-size:0.9rem;grid-column:1/-1;padding:40px 0;text-align:center;">
          No photos yet. <a href="upload.html" style="color:var(--accent);">Upload some first.</a>
        </div>`;
      } else {
        grid.innerHTML = photos.map(p => `
          <div class="picker-item" onclick="selectPhoto('${p.id}')">
            <img src="${p.src}" alt="${p.label}" />
            <div class="picker-item-info">
              <div class="picker-item-date">${formatDate(p.createdAt)}</div>
              <div class="picker-item-label">${p.label || 'Untitled'}</div>
            </div>
          </div>`).join('');
      }

      document.getElementById('picker-overlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closePicker() {
      document.getElementById('picker-overlay').classList.remove('open');
      document.body.style.overflow = '';
      pickerTarget = null;
    }

    function selectPhoto(id) {
      const photo = getPhotoById(id);
      if (!photo) return;
      selections[pickerTarget] = photo;
      renderSlot(pickerTarget, photo);
      closePicker();
      updateDiff();
    }

    function renderSlot(slot, photo) {
      const body = document.getElementById(`body-${slot}`);
      const info = document.getElementById(`info-${slot}`);

      body.innerHTML = `<img src="${photo.src}" alt="${photo.label}" onclick="openModal('${photo.src}')" />`;

      const parts = [];
      if (photo.label) parts.push(`<div class="info-label">${photo.label}</div>`);
      const meta = [formatDate(photo.createdAt)];
      if (photo.tag) meta.push(photo.tag);
      if (photo.weight) meta.push(`⚖️ ${photo.weight}`);
      parts.push(`<div>${meta.join(' · ')}</div>`);
      if (photo.notes) parts.push(`<div style="margin-top:4px;font-style:italic;opacity:0.7;">${photo.notes.slice(0, 80)}…</div>`);
      info.innerHTML = parts.join('');
    }

    function updateDiff() {
      const bar = document.getElementById('diff-bar');
      const { before, after } = selections;
      if (!before || !after) { bar.classList.remove('visible'); return; }

      const d1 = new Date(before.createdAt);
      const d2 = new Date(after.createdAt);
      const diffMs = Math.abs(d2 - d1);
      const diffDays = Math.round(diffMs / 86400000);
      const diffWeeks = Math.round(diffDays / 7);
      const diffMonths = Math.round(diffDays / 30);

      let timeLabel = `${diffDays} days`;
      if (diffDays >= 14) timeLabel = `${diffWeeks} weeks`;
      if (diffDays >= 60) timeLabel = `${diffMonths} months`;

      const items = [
        { val: formatDate(d1 < d2 ? before.createdAt : after.createdAt), label: 'Earliest photo' },
        { val: formatDate(d1 > d2 ? before.createdAt : after.createdAt), label: 'Latest photo' },
        { val: timeLabel, label: 'Time between' },
      ];

      if (before.weight && after.weight) {
        items.push({ val: `${before.weight} → ${after.weight}`, label: 'Weight change' });
      }

      document.getElementById('diff-info').innerHTML = items.map(i => `
        <div>
          <strong>${i.val}</strong>
          <div class="diff-label">${i.label}</div>
        </div>`).join('');

      bar.classList.add('visible');
    }

    // Auto-load last two photos for a quick compare
    const photos = getPhotos();
    if (photos.length >= 2) {
      selections.before = photos[photos.length - 1];
      selections.after = photos[0];
      renderSlot('before', selections.before);
      renderSlot('after', selections.after);
      updateDiff();
    }
  </script>
</body>
</html>
